app = "sendvpn-backend-gfyfeciw"
primary_region = "sjc"

[build]

[env]
PORT = "8080"
BOT_USERNAME = "jutsovpnbot"
# BOT_TOKEN — set via `fly secrets set BOT_TOKEN=...`
# SESSION_SECRET — set via `fly secrets set SESSION_SECRET=...`
# INTERNAL_API_KEY — set via `fly secrets set INTERNAL_API_KEY=...`
SUB_BASE = "https://sub.jutsovpn.online"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
cpu_kind = "shared"
cpus = 1
