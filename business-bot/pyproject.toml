[project]
name = "tg-business-bot"
version = "0.1.0"
description = "Telegram Business AI Assistant Bot"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7,<4",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "yt-dlp>=2024.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
